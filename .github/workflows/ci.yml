name: CI Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A branch with an open PR would otherwise build twice per push (once for the
# push, once for the PR). Both land in the same group here, so the newer run
# supersedes the older one instead of queueing beside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore InToolz.csproj -p:Platform=x64
          dotnet restore InToolz.Tests/InToolz.Tests.csproj -p:Platform=x64

      - name: Build
        run: dotnet build InToolz.csproj --no-restore --configuration Release -p:Platform=x64

      - name: Build tests
        run: dotnet build InToolz.Tests/InToolz.Tests.csproj --no-restore --configuration Release -p:Platform=x64

      - name: Run tests
        run: dotnet test InToolz.Tests/InToolz.Tests.csproj --no-build --configuration Release -p:Platform=x64 --verbosity normal

      - name: Test release guard
        shell: pwsh
        run: ./.github/scripts/ReleaseGuard.Tests.ps1

      - name: Test Store package check
        shell: pwsh
        run: ./.github/scripts/StorePackage.Tests.ps1
