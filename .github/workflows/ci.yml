name: CI Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A branch with an open PR would otherwise build twice per push (once for the
# push, once for the PR). Both land in the same group here, so the newer run
# supersedes the older one instead of queueing beside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore InToolz.csproj -p:Platform=x64
          dotnet restore InToolz.Tests/InToolz.Tests.csproj -p:Platform=x64

      # Both builds are captured so the warnings check below can read them.
      - name: Build
        shell: pwsh
        run: |
          dotnet build InToolz.csproj --no-restore --configuration Release -p:Platform=x64 | Tee-Object '${{ runner.temp }}/build-main.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tests
        shell: pwsh
        run: |
          dotnet build InToolz.Tests/InToolz.Tests.csproj --no-restore --configuration Release -p:Platform=x64 | Tee-Object '${{ runner.temp }}/build-tests.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The build may not print more unique warnings than .github/warning-baseline.txt allows
      # (see .github/scripts/BuildWarnings.ps1 and docs/WARNINGS_AUDIT.md).
      - name: Check build warnings
        shell: pwsh
        run: |
          . ./.github/scripts/BuildWarnings.ps1
          $result = Test-BuildWarnings -LogPath '${{ runner.temp }}/build-main.log', '${{ runner.temp }}/build-tests.log'
          Write-Host "Unique build warnings: $($result.Warnings.Count) (baseline $($result.Baseline))"
          $result.Warnings | ForEach-Object { Write-Host "  $_" }
          foreach ($notice in $result.Notices) { Write-Host "::notice::$notice" }
          foreach ($problem in $result.Problems) { Write-Host "::error::$problem" }
          if ($result.Problems.Count -gt 0) { exit 1 }

      - name: Run tests
        run: dotnet test InToolz.Tests/InToolz.Tests.csproj --no-build --configuration Release -p:Platform=x64 --verbosity normal

      - name: Test release guard
        shell: pwsh
        run: ./.github/scripts/ReleaseGuard.Tests.ps1

      - name: Test Store package check
        shell: pwsh
        run: ./.github/scripts/StorePackage.Tests.ps1

      - name: Test build warnings check
        shell: pwsh
        run: ./.github/scripts/BuildWarnings.Tests.ps1

  # The same build and unit tests, run natively on ARM64 hardware (#112). The x64 job above shows the code
  # compiles and passes for x64; this one shows the ARM64 build does too, where it will actually run,
  # instead of an ARM64 binary that is cross-compiled and never executed. (windows-11-arm runners are
  # free for public repositories.)
  test-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # So a log can show the tests really ran natively, not under x64 emulation.
      - name: Show the machine
        shell: pwsh
        run: |
          "OS architecture:      $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          "Process architecture: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          dotnet --info | Select-String -Pattern 'RID:|Architecture:'

      - name: Restore dependencies
        run: |
          dotnet restore InToolz.csproj -p:Platform=ARM64
          dotnet restore InToolz.Tests/InToolz.Tests.csproj -p:Platform=ARM64

      - name: Build
        run: dotnet build InToolz.csproj --no-restore --configuration Release -p:Platform=ARM64

      - name: Build tests
        run: dotnet build InToolz.Tests/InToolz.Tests.csproj --no-restore --configuration Release -p:Platform=ARM64

      - name: Run tests
        run: dotnet test InToolz.Tests/InToolz.Tests.csproj --no-build --configuration Release -p:Platform=ARM64 --verbosity normal
