name: Store Submit

# Submits an already-built Store package to Partner Center. Deliberately separate from release.yml:
# the package is built and checked once per release (see release.yml's "package" job), and submitting
# it is a distinct, independently-triggered act that should be re-runnable without rebuilding anything.
#
# This workflow always requires the "store-submit" GitHub Environment, which has a required reviewer
# and is restricted to the master branch, so every run - even a dry run - needs a human approval before
# the real Partner Center credentials become reachable.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The release.yml run ID whose InToolz-store artifact to submit (from the Actions tab, or the URL of that run)'
        required: true
      version:
        description: 'The version being submitted (e.g. 1.9.0.0), checked against the downloaded package'
        required: true
      dry_run:
        description: 'Dry run: validate credentials and the package, but never touch the Partner Center submission'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read   # to download the InToolz-store artifact from another workflow run

jobs:
  submit:
    runs-on: windows-latest
    environment: store-submit

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download the Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: InToolz-store
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the Store package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          . ./.github/scripts/StorePackage.ps1
          $upload = Get-ChildItem artifacts -Filter *.msixupload | Select-Object -First 1
          if (-not $upload) { throw 'No .msixupload was downloaded from that run.' }

          $problems = @(Test-StorePackage -Path $upload.FullName -Version $env:VERSION -AssociationFile InToolzPackaged/Package.StoreAssociation.xml)
          if ($problems.Count -gt 0) {
            foreach ($p in $problems) { Write-Host "::error::$p" }
            throw "The downloaded package failed the Store package check. Refusing to submit it."
          }
          Write-Host "$($upload.Name) passed the Store package check."
          echo "UPLOAD_PATH=$($upload.FullName)" >> $env:GITHUB_ENV

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Check credentials and app access
        # Read-only: 'info' and 'apps get' never touch a submission. Always run, dry run or not - this
        # is the actual proof the four secrets and the app ID are correct.
        run: |
          msstore info -v
          msstore apps get ${{ vars.STORE_APP_ID }} -v

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: credentials and app access checked above, and $env:UPLOAD_PATH passed the Store package check." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          echo "Nothing was staged or submitted. Re-run with dry_run=false to actually submit it." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Stage the package as a draft submission
        # Real side effect from here on: this uploads the package and updates the draft submission in
        # Partner Center. It does not commit/certify it - that's the next step - but it is not a no-op
        # either, which is why it's skipped entirely in a dry run rather than run with no further effect.
        if: ${{ !inputs.dry_run }}
        run: msstore publish . -i "$env:UPLOAD_PATH" -id ${{ vars.STORE_APP_ID }} --noCommit

      - name: Commit the submission for certification
        if: ${{ !inputs.dry_run }}
        run: |
          msstore submission publish ${{ vars.STORE_APP_ID }}
          msstore submission poll ${{ vars.STORE_APP_ID }}
