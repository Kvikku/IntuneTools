name: Release

on:
  push:
    tags:
      - '*.*.*.*'   # matches version tags like 1.4.0.0

  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.4.0.0). Leave empty to auto-increment patch.'
        required: false
      dry_run:
        description: 'Dry run: check, build and zip, but do not push the version bump or create the draft release'
        type: boolean
        default: false

permissions:
  contents: write        # needed to create releases and upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fails fast, before anything is stamped, built or pushed, when the release looks unintended.
  # The checks live in .github/scripts/ReleaseGuard.ps1, which has its own tests.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # to look up CI runs for the commit
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      skip: ${{ steps.published.outputs.SKIP }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history and tags: needed to check the commit is on master and the version is new

      - name: Determine version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $explicit = 'true'
          if ($env:EVENT -eq 'workflow_dispatch' -and $env:INPUT_VERSION -ne '') {
            $ver = $env:INPUT_VERSION
          } elseif ($env:EVENT -eq 'push') {
            $ver = $env:REF_NAME
          } else {
            # Auto-increment: read current version from csproj and bump patch
            $explicit = 'false'
            $csproj = Get-Content InToolz.csproj -Raw
            if ($csproj -match '<Version>(\d+)\.(\d+)\.(\d+)\.(\d+)</Version>') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3] + 1
              $build = [int]$Matches[4]
              $ver = "$major.$minor.$patch.$build"
            } else {
              Write-Error "Could not read version from InToolz.csproj"
              exit 1
            }
          }
          # Later jobs put the version into commands and file names, so a malformed one stops here
          # even in a dry run.
          if ($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Host "::error::Version '$ver' is not in major.minor.patch.build form (for example 1.9.0.0)."
            exit 1
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "EXPLICIT=$explicit" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      # Publishing a draft release creates its tag, and that tag push starts this workflow again for a
      # version that is already out. Rebuilding would overwrite the published release's notes and zip
      # (it did, for 1.8.0.0), so such a run ends here, quietly. Dispatching an already-published
      # version by hand is a mistake and still fails loudly in the checks below.
      - name: Skip the run started by publishing a draft
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $skip = 'false'
          if ($env:EVENT -eq 'push') {
            $published = gh release list --repo $env:REPOSITORY --limit 200 --json tagName,isDraft --jq ('[.[] | select(.tagName == "' + $env:VERSION + '" and .isDraft == false)] | length')
            if ($LASTEXITCODE -eq 0 -and [int]$published -ge 1) {
              $skip = 'true'
              Write-Host "::notice::Release $($env:VERSION) is already published, so this tag run has nothing to do. Publishing a draft creates its tag, which starts this workflow again."
              "Release $($env:VERSION) is already published; this run was started by its tag and did nothing." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          echo "SKIP=$skip" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Check this release is intended
        if: ${{ steps.published.outputs.SKIP != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          EXPLICIT: ${{ steps.version.outputs.EXPLICIT }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          . ./.github/scripts/ReleaseGuard.ps1
          $dryRun = $env:DRY_RUN -eq 'true'
          $problems = @(Test-ReleaseIntent -Version $env:VERSION -Sha $env:SHA -Repository $env:REPOSITORY `
            -CurrentTag $env:CURRENT_TAG -VersionWasExplicit ($env:EXPLICIT -eq 'true'))

          if ($problems.Count -eq 0) {
            "Release checks passed for $($env:VERSION) at $($env:SHA.Substring(0, 7))." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          foreach ($p in $problems) {
            if ($dryRun) { Write-Host "::warning::$p (dry run: this would have stopped a real release)" }
            else         { Write-Host "::error::$p" }
          }
          $heading = if ($dryRun) { 'Release checks would have failed (dry run)' } else { 'Release checks failed' }
          "### $heading`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $problems | ForEach-Object { "- $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Exit explicitly: the runner would otherwise exit with the last git/gh command's code.
          if ($dryRun) { exit 0 } else { exit 1 }

  build:
    needs: validate
    if: ${{ needs.validate.outputs.skip != 'true' }}
    runs-on: windows-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update version in project files
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./.github/scripts/Set-ReleaseVersion.ps1 -Version $env:VERSION

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained app
        run: >
          dotnet publish InToolz.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=${{ needs.validate.outputs.version }}
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Create zip archive
        shell: pwsh
        run: |
          $publishDir = "bin\x64\Release\net8.0-windows10.0.22621.0\win-x64\publish"
          $zipName = "InToolz_${{ needs.validate.outputs.version }}_x64.zip"
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InToolz-x64
          path: ${{ steps.zip.outputs.ZIP_NAME }}

      - name: Commit version bump
        # Never from a dry run, and never from a branch other than master: this step pushes to master.
        if: ${{ !inputs.dry_run && (github.ref_type == 'tag' || github.ref_name == 'master') }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add InToolz.csproj Package.appxmanifest InToolzPackaged/Package.appxmanifest
          # `exit` can't follow && in pwsh, so check the exit code explicitly
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { echo "No version changes to commit"; exit 0 }
          git commit -m "Bump version to ${{ needs.validate.outputs.version }}"
          git push origin HEAD:master

  # Builds the Microsoft Store package, and a sideload package, from the repo. The file submitted to the
  # Store no longer depends on whoever builds it by hand, and is checked before anyone can upload it.
  package:
    needs: validate
    if: ${{ needs.validate.outputs.skip != 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update version in project files
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./.github/scripts/Set-ReleaseVersion.ps1 -Version $env:VERSION

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build the Store package
        shell: pwsh
        run: |
          # The packaging project (.wapproj) needs Visual Studio's MSBuild and its Desktop Bridge targets;
          # `dotnet build` cannot build it.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $vsRoot 'MSBuild\Current\Bin\MSBuild.exe'
          $bridge = Join-Path $vsRoot 'MSBuild\Microsoft\DesktopBridge\Microsoft.DesktopBridge.targets'
          if (-not (Test-Path $msbuild)) { throw "MSBuild was not found under '$vsRoot'." }
          if (-not (Test-Path $bridge)) { throw "The Visual Studio on this runner has no Desktop Bridge packaging targets ('$bridge')." }

          # Record what built it: the runner image drifts, and this is the first thing to look at if a package ever differs
          $vsVersion = & $vswhere -latest -products * -property catalog_productDisplayVersion
          $msbuildVersion = (& $msbuild -version -nologo) | Select-Object -Last 1
          $toolchain = @(
            '### Store package build',
            '',
            "- Visual Studio $vsVersion, MSBuild $msbuildVersion",
            "- .NET SDK $(dotnet --version)"
          )
          $toolchain | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $toolchain | ForEach-Object { Write-Host $_ }

          $out = Join-Path $PWD 'AppPackages'
          & $msbuild InToolzPackaged\InToolzPackaged.wapproj /restore /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 `
            /p:AppxAutoIncrementPackageRevision=False /p:GenerateAppxPackageOnBuild=true `
            "/p:AppxPackageDir=$out\"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

      - name: Verify the Store package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          . ./.github/scripts/StorePackage.ps1
          $upload = Get-ChildItem AppPackages -Filter *.msixupload | Select-Object -First 1
          if (-not $upload) { throw 'The build produced no .msixupload.' }

          # Not softened in a dry run: a package that fails this must never be uploaded to the Store.
          $problems = @(Test-StorePackage -Path $upload.FullName -Version $env:VERSION -AssociationFile InToolzPackaged/Package.StoreAssociation.xml)
          if ($problems.Count -gt 0) {
            foreach ($p in $problems) { Write-Host "::error::$p" }
            "### Store package check failed`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $problems | ForEach-Object { "- $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
          "- ``$($upload.Name)`` ($([math]::Round($upload.Length / 1MB, 1)) MB) passed the Store package check: identity, publisher and version match, x64 only, executable present" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit 0

      - name: Zip the sideload package
        id: sideload
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Signed with a temporary certificate that is generated per build, so it is not attached to
          # the release yet: users would have to trust a different certificate every time.
          $folder = Get-ChildItem AppPackages -Directory -Filter '*_Test' | Select-Object -First 1
          if (-not $folder) { throw 'The build produced no sideload folder.' }
          $zip = "InToolz_$($env:VERSION)_x64_sideload.zip"
          Compress-Archive -Path "$($folder.FullName)\*" -DestinationPath $zip
          echo "ZIP_NAME=$zip" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload the Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InToolz-store
          path: AppPackages/*.msixupload
          if-no-files-found: error

      - name: Upload the sideload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InToolz-sideload
          path: ${{ steps.sideload.outputs.ZIP_NAME }}
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [build, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download the release zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: InToolz-x64
          path: artifacts

      # The release step below attaches artifacts/*.zip, which a dry run never reaches. Prove the file is
      # where that pattern expects it, and stop here rather than publish a draft without its zip.
      - name: Check the release zip is there
        run: |
          shopt -s nullglob
          files=(artifacts/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release zip was downloaded into artifacts/."
            exit 1
          fi
          ls -l "${files[@]}"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ needs.build.outputs.version }}" \
            -f target_commitish="master" \
            --jq '.body')
          {
            echo "BODY<<EOF"
            echo "$NOTES"
            echo ""
            echo "## Download"
            echo ""
            echo "As always, the app and this new update is available on the [Microsoft Store](https://apps.microsoft.com/detail/9phqrcx3gkxd)."
            echo ""
            echo "## Manual install"
            echo "If you prefer to install manually and not use the store, I've attached a zip of the self-contained app. Extract it and run \`InToolz.exe\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Preview release notes (dry run)
        if: ${{ inputs.dry_run }}
        env:
          BODY: ${{ steps.notes.outputs.BODY }}
        run: |
          {
            echo "## Dry run: release notes preview for ${{ needs.build.outputs.version }}"
            echo ""
            echo "No draft release was created and nothing was pushed to master."
            echo ""
            echo "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          draft: true
          body: ${{ steps.notes.outputs.BODY }}
          files: artifacts/*.zip